# Reverse proxy: known backend route prefixes -> FastAPI/uvicorn on
# 127.0.0.1:8000, everything else -> the built frontend (SPA fallback).
# proxy_buffering off is required for FR15's token-by-token streaming replies.
# Listens on loopback-reachable port 80 only — no inbound 80/443 firewall
# rule exists on this VM; cloudflared reaches this over localhost and is the
# only path in from the internet. See MVP_Design.md §3.1.
server {
    listen 80;
    server_name _;

    root /home/sumit/civic-voice-agent/frontend/dist;
    index index.html;

    location ~ ^/(health|complaints|suggestions|stats|settings|eval|intake|docs|openapi\.json|redoc) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
