[pytest]
# Tests marked `live` call the real deployed stack (LLM providers, the
# Cloudflare tunnel, Supabase) rather than mocks. They are genuine signal —
# the defects they cover live in PROMPTS and in deployed wiring, which a
# mocked test cannot assert anything about — but they are slow (minutes, not
# seconds) and depend on external services being reachable.
#
# Default `pytest` runs everything, including them.
# For a fast inner-loop run:      pytest -m "not live"
markers =
    live: hits real external services (LLM providers / deployed API / Supabase); slow, network-dependent
