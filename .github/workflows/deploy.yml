name: Deploy to VM

# Walking-skeleton deploy (MVP_roadmap.md Phase 2): on push to main, SSH into
# the always-on GCE VM, pull latest, reinstall deps (idempotent/fast when
# unchanged), rebuild the frontend, and restart the backend under systemd.
# Secrets (OpenRouter key, DATABASE_URL, etc.) are never touched here — the
# VM fetches those itself from Secret Manager via deploy/fetch_secrets.sh as
# part of the systemd unit's ExecStartPre.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual re-deploy (e.g. after a secret rotation) without needing an empty commit

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            set -e
            cd ~/civic-voice-agent
            # Hard-sync to origin/main rather than `git pull` — the VM is a
            # pure deploy target and should never carry independent local
            # state (e.g. from an out-of-band sync) that could conflict.
            git fetch origin main
            git reset --hard origin/main

            cd backend
            source venv/bin/activate
            pip install -q -r ../requirements.txt

            cd ../frontend
            npm install --silent
            VITE_API_BASE_URL= npm run build

            sudo systemctl restart civic-voice.service

            # Poll instead of a fixed sleep: uvicorn's own startup (import of
            # torch/ollama/google-cloud-logging + JWKS/DB init) measured at
            # ~11s on this e2-micro even when everything is healthy — a fixed
            # `sleep 3` was failing this smoke check on every single deploy
            # (discovered in Phase 8), which is worse than no check at all
            # since a real failure would look identical to "just needed more
            # time." Poll for up to 45s; only a genuine non-2xx/timeout fails
            # the job.
            for i in $(seq 1 15); do
              if curl -sf http://localhost/health; then
                echo "Health check passed on attempt $i"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed after 45s — service did not come up healthy"
            sudo systemctl status civic-voice.service --no-pager -l
            exit 1
